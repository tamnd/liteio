# SPDX-License-Identifier: Apache-2.0
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - revive

  settings:
    revive:
      rules:
        # Keep the exported-symbol doc-comment checks, but allow the
        # domain-standard names (ObjectLayer, ObjectInfo, StorageAPI) that
        # intentionally repeat their package name, matching the design spec.
        - name: exported
          disabled: false
          arguments:
            - disableStutteringCheck

  exclusions:
    generated: lax
    rules:
      # Table-driven tests and benchmarks legitimately ignore some errors.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
